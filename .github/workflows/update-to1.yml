name: Update To 1 and deploy Pages
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  update-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Sheet and validate before updating
        if: github.event_name != 'push'
        run: python scripts/sync_to1.py
      - name: Save synchronized report
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html to-1/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update To 1 from public Google Sheet'
            git push
          fi
      - name: Prepare public pages only
        run: |
          mkdir -p _site/to-1
          cp index.html _site/index.html
          cp to-1/index.html _site/to-1/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
